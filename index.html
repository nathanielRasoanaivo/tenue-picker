<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366f1">
    <title>Tenue du Jour</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>👔 Tenue du Jour</h1>
            <p class="subtitle">Laissez le hasard choisir pour vous</p>
        </header>

        <!-- Widget Météo -->
        <div id="weatherWidget" class="weather-widget" style="display: none;"></div>

        <main>
            <!-- Section Upload -->
            <section class="upload-section" id="uploadSection">
                <div class="upload-area" id="uploadArea">
                    <input type="file" id="fileInput" accept="image/*" multiple hidden>
                    <div class="upload-content">
                        <span class="upload-icon">📸</span>
                        <p>Cliquez ou glissez vos photos de tenues</p>
                        <button class="btn-secondary" id="uploadBtn">Ajouter des photos</button>
                    </div>
                </div>
            </section>

            <!-- Section Sélection -->
            <section class="action-section" id="actionSection" style="display: none;">
                <button class="btn-primary" id="pickOutfitBtn">
                    🎲 Choisir ma tenue
                </button>
                <button class="btn-secondary" id="addMoreBtn" style="margin-top: 10px;">
                    📸 Ajouter des tenues
                </button>
                <button class="btn-secondary" id="resetAllBtn" style="margin-top: 10px; display: none;">
                    🔄 Réinitialiser les tenues
                </button>
                <button class="btn-secondary" id="optimizeBtn" style="margin-top: 10px;">
                    ⚡ Optimiser le stockage
                </button>
            </section>

            <!-- Résultat -->
            <section class="result-section" id="resultSection" style="display: none;">
                <div class="result-card">
                    <h2>Votre tenue du jour</h2>
                    <img id="selectedOutfit" src="" alt="Tenue sélectionnée">
                    <div class="result-actions">
                        <button class="btn-secondary" id="rePickBtn">🔄 Rechoisir</button>
                        <button class="btn-secondary" id="closeResultBtn">✓ C'est bon</button>
                    </div>
                </div>
            </section>

            <!-- Modal Toutes Utilisées -->
            <section class="result-section" id="allUsedSection" style="display: none;">
                <div class="result-card">
                    <h2>🎉 Toutes les tenues portées !</h2>
                    <p style="margin: 20px 0; color: #94a3b8; text-align: center;">
                        Vous avez porté toutes vos tenues. Voulez-vous recommencer ?
                    </p>
                    <div class="result-actions">
                        <button class="btn-secondary" id="resetFromModalBtn">🔄 Réinitialiser</button>
                        <button class="btn-secondary" id="closeAllUsedModalBtn">Annuler</button>
                    </div>
                </div>
            </section>

            <!-- Galerie -->
            <section class="gallery-section" id="gallerySection" style="display: none;">
                <div class="gallery-header">
                    <h2>Mes tenues (<span id="availableCount">0</span> / <span id="outfitCount">0</span>)</h2>
                    <button class="btn-text" id="toggleGalleryBtn">Voir tout</button>
                </div>
                <div class="gallery" id="gallery"></div>
            </section>
        </main>
    </div>

    <!-- Indicateur Upload -->
    <div id="uploadProgress" class="progress-overlay" style="display: none;">
        <div class="progress-card">
            <div class="spinner"></div>
            <p>Ajout des tenues...</p>
            <p class="progress-text"><span id="uploadCurrent">0</span> / <span id="uploadTotal">0</span></p>
        </div>
    </div>

    <!-- Indicateur Optimisation -->
    <div id="optimizationProgress" class="progress-overlay" style="display: none;">
        <div class="progress-card">
            <div class="spinner"></div>
            <p>Optimisation en cours...</p>
            <p class="progress-text"><span id="optCurrent">0</span> / <span id="optTotal">0</span></p>
            <div class="progress-bar">
                <div id="optProgressBar" class="progress-bar-fill"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
